<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#F2F2F7;--surface:#fff;--border:rgba(0,0,0,0.10);--text:#1C1C1E;--text2:#6C6C70;--accent:#A07850;--blue:#007AFF;--green:#34C759;--red:#FF3B30;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:#1C1C1E;--border:rgba(255,255,255,0.10);--text:#fff;--text2:#98989D;--accent:#C9A97A;--blue:#0A84FF}}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#app{max-width:430px;margin:0 auto}
.hdr{display:flex;align-items:center;padding:calc(var(--sat) + 12px) 16px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.hdr h1{flex:1;font-size:17px;font-weight:600;text-align:center}
.pg{padding:16px 16px calc(var(--sab) + 20px)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-n{font-size:28px;font-weight:700;color:var(--accent)}
.stat-l{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.box-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden}
.box-hdr{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.box-hdr:active{background:var(--bg)}
.box-num{width:36px;height:36px;background:rgba(160,120,80,0.10);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--accent);flex-shrink:0}
.box-info{flex:1}
.box-name{font-size:15px;font-weight:600}
.box-meta{font-size:12px;color:var(--text2);margin-top:2px}
.box-arrow{color:var(--text2);font-size:18px}
.items{border-top:1px solid var(--border);padding:8px 16px 12px;display:none}
.items.open{display:block}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.04)}
.item:last-child{border-bottom:none}
.item-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
.item-name{font-size:14px;font-weight:500}
.pri-first{background:rgba(255,59,48,0.10);color:var(--red);font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <h1>📦 Boxly</h1>
  </div>
  <div class="pg">
    <div class="stat-row">
      <div class="stat"><div class="stat-n" id="s-boxes">0</div><div class="stat-l">Boxes</div></div>
      <div class="stat"><div class="stat-n" id="s-items">0</div><div class="stat-l">Items</div></div>
      <div class="stat"><div class="stat-n" id="s-photos">0</div><div class="stat-l">Photos</div></div>
    </div>
    <div id="box-list"></div>
  </div>
</div>

try { localStorage.setItem('boxly-v4', JSON.stringify(DATA)); } catch(e) {}

// Render
const list = document.getElementById('box-list');
let totalItems = 0, totalPhotos = 0;

DATA.forEach(box => {
  totalItems += box.groups.length;
  box.groups.forEach(g => totalPhotos += (g.photos||[]).length);
  
  const card = document.createElement('div');
  card.className = 'box-card';
  
  const pri = box.priority === 'first' ? '<span class="pri-first">Open First</span>' : '';
  const itemsHtml = box.groups.map(g => {
    const thumb = g.photos && g.photos[0]

      : `<div class="item-thumb" style="background:var(--bg)"></div>`;
    return `<div class="item">${thumb}<span class="item-name">${g.name}</span></div>`;
  }).join('');
  
  card.innerHTML = `
    <div class="box-hdr" onclick="this.nextSibling.classList.toggle('open');this.querySelector('.box-arrow').textContent=this.nextSibling.classList.contains('open')?'⌃':'⌄'">

    </div>
    <div class="items">${itemsHtml}</div>`;
  
  list.appendChild(card);
});

document.getElementById('s-boxes').textContent = DATA.length;
document.getElementById('s-items').textContent = totalItems;
document.getElementById('s-photos').textContent = totalPhotos;
